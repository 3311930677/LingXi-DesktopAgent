[package]
name = "lingxi-tools"
version.workspace = true
edition.workspace = true
description = "Tool trait, registry, and cross-platform built-in tools for the LingXi agent"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
