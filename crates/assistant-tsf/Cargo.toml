# Excluded from the root workspace — requires MSVC toolchain (cdylib + COM).
[package]
name = "assistant-tsf"
version = "0.1.0"
edition = "2021"
description = "LingXi TSF Text Input Processor (system IME) backed by assistant-ime"

[lib]
crate-type = ["cdylib"]

[dependencies]
assistant-ime = { path = "../assistant-ime" }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[build-dependencies]

[package.metadata.rust-toolchain]
channel = "stable-x86_64-pc-windows-msvc"
