[package]
name = "overlay"
version = "0.1.0"
edition = "2021"
description = "LingXi floating overlay for the cross-app input assistant"

# Standalone crate (excluded from the workspace): requires the MSVC toolchain
# and WebView2 to build, unlike the GNU-based rest of the project.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
assistant-core = { path = "../../crates/assistant-core" }
assistant-windows = { path = "../../crates/assistant-windows" }
assistant-inference = { path = "../../crates/assistant-inference" }
lingxi-agent = { path = "../../crates/lingxi-agent" }
lingxi-tools = { path = "../../crates/tools" }
lingxi-tools-windows = { path = "../../crates/tools-windows" }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
