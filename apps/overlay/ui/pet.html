<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵犀桌宠</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <button class="pet idle" id="pet" aria-label="打开灵犀面板" title="单击打开灵犀，拖动可移动">
      <span class="halo"></span>
      <img
        class="avatar"
        id="pet-avatar"
        src="assets/lingxi-hamster/idle.png"
        alt="灵犀仓鼠"
        draggable="false"
      />
      <span class="bubble" id="bubble">灵犀</span>
    </button>
    <script src="pet.js"></script>
  </body>
</html>
