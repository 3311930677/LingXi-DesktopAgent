<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <style>
    .b{animation:br 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 98%}
    .e{animation:bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
    .t{animation:ta 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:8% 80%}
    .w{animation:wf 1.9s ease-in-out infinite;transform-box:fill-box}
    .wl{transform-origin:92% 88%}.wr{transform-origin:8% 88%;animation-delay:.15s}
    @keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
    @keyframes bl{0%,90.5%,94.5%,100%{transform:scaleY(1)}92.5%{transform:scaleY(.06)}}
    @keyframes ta{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-7deg)}}
    @keyframes wf{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg)}}
  </style>
  <defs>
    <radialGradient id="gb" cx="38%" cy="28%" r="92%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="58%" stop-color="#FFD968"/>
      <stop offset="100%" stop-color="#F0B843"/>
    </radialGradient>
    <radialGradient id="gh" cx="40%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#FFF4C6"/>
      <stop offset="55%" stop-color="#FFE07D"/>
      <stop offset="100%" stop-color="#F3C14E"/>
    </radialGradient>
  </defs>

  <!-- 尾巴：粗短弯尾 + 心形尾尖 -->
  <g class="t">
    <path d="M144 196 Q176 190 184 162 Q187 148 175 143 Q177 158 167 169 Q155 180 141 182 Z" fill="#F2C24F"/>
    <path d="M179 139 c-4 -6 -13 -4 -13 3 c0 6 8 10 13 13 c5 -3 13 -7 13 -13 c0 -7 -9 -9 -13 -3 z" fill="#FFB0A0"/>
  </g>

  <!-- 小翅膀 -->
  <path class="w wl" d="M58 152 Q24 138 20 108 Q44 118 60 136 Z" fill="#FFCF58"/>
  <path class="w wl" d="M56 146 Q36 136 32 118 Q47 126 58 138 Z" fill="#FFE89A"/>
  <path class="w wr" d="M142 152 Q176 138 180 108 Q156 118 140 136 Z" fill="#FFCF58"/>
  <path class="w wr" d="M144 146 Q164 136 168 118 Q153 126 142 138 Z" fill="#FFE89A"/>

  <g class="b">
    <!-- 身体 -->
    <ellipse cx="78" cy="226" rx="18" ry="10" fill="#EBB444"/>
    <ellipse cx="122" cy="226" rx="18" ry="10" fill="#EBB444"/>
    <ellipse cx="100" cy="186" rx="50" ry="43" fill="url(#gb)"/>
    <ellipse cx="100" cy="195" rx="30" ry="26" fill="#FFF6D8"/>
    <ellipse cx="57" cy="180" rx="10" ry="14" fill="#F5C64F" transform="rotate(24 57 180)"/>
    <ellipse cx="143" cy="180" rx="10" ry="14" fill="#F5C64F" transform="rotate(-24 143 180)"/>
    <!-- 头 -->
    <ellipse cx="100" cy="93" rx="58" ry="53" fill="url(#gh)"/>
    <!-- 弯角 -->
    <path d="M64 48 Q54 24 70 13 Q71 30 80 43 Z" fill="#FFF1C4"/>
    <path d="M64 48 Q54 24 70 13 Q66 27 72 38 Z" fill="#F5D878" opacity=".65"/>
    <path d="M136 48 Q146 24 130 13 Q129 30 120 43 Z" fill="#FFF1C4"/>
    <path d="M136 48 Q146 24 130 13 Q134 27 128 38 Z" fill="#F5D878" opacity=".65"/>
    <!-- 眼睛：大眼双高光 -->
    <g class="e">
      <circle cx="74" cy="90" r="9" fill="#33261A"/>
      <circle cx="77" cy="86.8" r="3" fill="#fff"/>
      <circle cx="71.5" cy="93" r="1.4" fill="#fff" opacity=".85"/>
    </g>
    <g class="e">
      <circle cx="126" cy="90" r="9" fill="#33261A"/>
      <circle cx="129" cy="86.8" r="3" fill="#fff"/>
      <circle cx="123.5" cy="93" r="1.4" fill="#fff" opacity=".85"/>
    </g>
    <ellipse cx="52" cy="112" rx="10" ry="6" fill="#FF9E8E" opacity=".55"/>
    <ellipse cx="148" cy="112" rx="10" ry="6" fill="#FF9E8E" opacity=".55"/>
    <!-- 大鼻吻 -->
    <ellipse cx="100" cy="118" rx="27" ry="17" fill="#FFE9A0"/>
    <ellipse cx="91" cy="114" rx="2.6" ry="3.4" fill="#C98F3D"/>
    <ellipse cx="109" cy="114" rx="2.6" ry="3.4" fill="#C98F3D"/>
    <path d="M88 127 Q100 136 112 127" fill="none" stroke="#7A5423" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
