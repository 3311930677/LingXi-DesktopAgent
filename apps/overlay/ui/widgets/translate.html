<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全屏翻译 · 灵犀</title>
<link rel="stylesheet" href="widget.css">
<style>
.lang-row {
  flex: 0 0 auto;
  display: flex;
  gap: 6px;
  align-items: center;
}
.lang-row select { flex: 0 0 auto; width: auto; min-width: 80px; }
.lang-row .arrow { color: var(--text-faint); flex: 0 0 auto; }
.lang-row .src-input { flex: 1 1 auto; }
.translate-result {
  flex: 1 1 auto;
  min-height: 60px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: var(--radius-sm);
  padding: 12px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
}
.translate-result::-webkit-scrollbar { width: 6px; }
.translate-result::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 6px; }
</style>
</head>
<body>
<div class="widget-titlebar">
  <div class="title"><span class="icon">🌐</span> 翻译</div>
  <button class="widget-close" id="widget-close" title="关闭 (Esc)">×</button>
</div>
<div class="widget-body">
  <div class="lang-row">
    <select id="from-lang">
      <option value="auto">自动检测</option>
      <option value="zh">中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
    </select>
    <span class="arrow">→</span>
    <select id="to-lang">
      <option value="zh">中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
    </select>
  </div>
  <textarea id="src-text" placeholder="输入要翻译的文本..." rows="3"></textarea>
  <div class="toolbar">
    <button class="btn btn-primary" id="translate-btn">翻译</button>
    <button class="btn btn-sm" id="paste-btn">粘贴</button>
    <button class="btn btn-sm" id="copy-result-btn">复制结果</button>
    <span class="status" id="status"></span>
  </div>
  <div class="translate-result" id="result">翻译结果会显示在这里</div>
</div>
<script src="widget.js"></script>
<script>
"use strict";
const el = {
  fromLang: document.getElementById("from-lang"),
  toLang: document.getElementById("to-lang"),
  srcText: document.getElementById("src-text"),
  translateBtn: document.getElementById("translate-btn"),
  pasteBtn: document.getElementById("paste-btn"),
  copyResultBtn: document.getElementById("copy-result-btn"),
  result: document.getElementById("result"),
  status: document.getElementById("status"),
};

async function doTranslate() {
  const text = el.srcText.value.trim();
  if (!text) { setStatus("请输入要翻译的文本", "err"); return; }
  if (!invoke) { setStatus("需要 Tauri 环境", "err"); return; }
  el.translateBtn.disabled = true;
  setStatus("正在翻译...");
  try {
    const res = await invoke("widget_translate", {
      text,
      from: el.fromLang.value,
      to: el.toLang.value,
    });
    el.result.textContent = res.translated || "(无翻译结果)";
    setStatus("翻译完成", "ok");
  } catch(e) {
    setStatus("翻译失败: " + String(e), "err");
  }
  el.translateBtn.disabled = false;
}

el.translateBtn.onclick = doTranslate;
el.srcText.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); doTranslate(); }
});
el.pasteBtn.onclick = async () => {
  try {
    el.srcText.value = await readClipboard();
    el.srcText.focus();
  } catch { setStatus("无法读取剪贴板", "err"); }
};
el.copyResultBtn.onclick = async () => {
  try {
    await writeClipboard(el.result.textContent);
    setStatus("已复制", "ok");
  } catch { setStatus("复制失败", "err"); }
};

setupWidgetClose("widget-translate");
el.srcText.focus();
</script>
</body>
</html>
